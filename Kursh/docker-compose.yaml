
services:
  pg_courses:
    image: postgres:16
    container_name: edu-pg-courses
    environment:
      POSTGRES_DB: ${COURSES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${COURSES_DB_PORT}:5432"
    volumes:
      - pg_courses_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${COURSES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg_students:
    image: postgres:16
    container_name: edu-pg-students
    environment:
      POSTGRES_DB: ${STUDENTS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${STUDENTS_DB_PORT}:5432"
    volumes:
      - pg_students_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${STUDENTS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg_certs:
    image: postgres:16
    container_name: edu-pg-certs
    environment:
      POSTGRES_DB: ${CERTS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${CERTS_DB_PORT}:5432"
    volumes:
      - pg_certs_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${CERTS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate_courses:
    image: migrate/migrate
    container_name: edu-migrate-courses
    depends_on:
      pg_courses:
        condition: service_healthy
    volumes:
      - ./backend/courses/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg_courses:5432/${COURSES_DB}?sslmode=disable",
        "up"
      ]
    restart: "on-failure"

  migrate_students:
    image: migrate/migrate
    container_name: edu-migrate-students
    depends_on:
      pg_students:
        condition: service_healthy
    volumes:
      - ./backend/students/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg_students:5432/${STUDENTS_DB}?sslmode=disable",
        "up"
      ]
    restart: "on-failure"

  migrate_certs:
    image: migrate/migrate
    container_name: edu-migrate-certs
    depends_on:
      pg_certs:
        condition: service_healthy
    volumes:
      - ./backend/certificates/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg_certs:5432/${CERTS_DB}?sslmode=disable",
        "up"
      ]
    restart: "on-failure"

  courses-service:
    build:
      context: ./backend/courses
    container_name: edu-courses
    env_file:
      - ./backend/courses/.env
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg_courses:5432/${COURSES_DB}?sslmode=disable"
    depends_on:
      pg_courses:
        condition: service_healthy
      migrate_courses:
        condition: service_completed_successfully
    ports:
      - "${COURSES_PORT}:8080"

  students-service:
    build:
      context: ./backend/students
    container_name: edu-students
    env_file:
      - ./backend/students/.env
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg_students:5432/${STUDENTS_DB}?sslmode=disable"
    depends_on:
      pg_students:
        condition: service_healthy
      migrate_students:
        condition: service_completed_successfully
    ports:
      - "${STUDENTS_PORT}:8080"

  certificates-service:
    build:
      context: ./backend/certificates
    container_name: edu-certs
    env_file:
      - ./backend/certificates/.env
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg_certs:5432/${CERTS_DB}?sslmode=disable"
    depends_on:
      pg_certs:
        condition: service_healthy
      migrate_certs:
        condition: service_completed_successfully
    ports:
      - "${CERTS_PORT}:8080"

  api-gateway:
    build:
      context: ./backend/gateway
    container_name: edu-gateway
    env_file:
      - ./backend/gateway/.env
    environment:
      PORT: "8080"
      COURSES_URL: "http://courses-service:8080"
      STUDENTS_URL: "http://students-service:8080"
      CERTS_URL: "http://certificates-service:8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://192.168.0.107:3000}
    depends_on:
      courses-service:
        condition: service_started
      students-service:
        condition: service_started
      certificates-service:
        condition: service_started
    ports:
      - "${GATEWAY_PORT}:8080"

  api-gateway-2:
    build:
      context: ./backend/gateway
    container_name: edu-gateway-2
    env_file:
      - ./backend/gateway/.env
    environment:
      PORT: "8080"
      COURSES_URL: "http://courses-service:8080"
      STUDENTS_URL: "http://students-service:8080"
      CERTS_URL: "http://certificates-service:8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://192.168.0.107:3000}
    depends_on:
      courses-service:
        condition: service_started
      students-service:
        condition: service_started
      certificates-service:
        condition: service_started

  front:
    build:
      context: ./front
    container_name: edu-front
    env_file:
      - ./front/.env
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "3000:3000"

  frontend-nginx:
    image: nginx:1.27-alpine
    container_name: edu-frontend-nginx
    depends_on:
      - front
      - api-gateway
    volumes:
      - ./front/build:/usr/share/nginx/html:ro
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  pg_courses_data:
  pg_students_data:
  pg_certs_data:
